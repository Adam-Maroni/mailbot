# MailBot Router policy — per-task routing decisions.
#
# Architecture §"D11: policy.yaml reload semantics":
#   - validation-or-no-swap on every edit
#   - mid-call race is acceptable (in-flight calls finish under pre-swap policy)
#
# Edit this file at runtime; watchfiles will reload it. Invalid edits stay
# logged but do NOT take effect — the previously-running policy continues.
#
# Schema reference: mailbot_api/router/policy.py (PolicyTable / PolicyEntry).

# v1 bump (2026-07-04, Story 9.5.5): benchmark-reviewed against
# benchmark_runs.run_id=db48480f-9692-4791-b3e2-4b3a2ab1fed8 (Story 9.5.3 AC-5,
# draft_reply Haiku-vs-Opus). Verdict INSUFFICIENT_DATA → route (b) no-change:
# version bump only, zero routing mutations. Rationale: epic-9-5-retro-2026-07-04.md
# § "policy.yaml v0→v1". Hypothesis annotations retained for v2 re-review.
version: "policy-v1-2026-07-04"

tasks:
  coarse_class:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 256
    lane: "batch"
    sensitivity: "any"
    notes: "Coarse classification (transactional / newsletter / human / notification / spam_like / unknown — 6-label taxonomy per Story 3-2) — small output, batch-lane appropriate."

  sensitivity_class:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v3"
    escalate: false
    max_tokens_out: 128
    lane: "batch"
    sensitivity: "any"
    notes: "Sensitivity classification — the gate that determines sensitivity. Must be local-only per Rule Q. sensitivity=any here means this task itself is unconstrained because it IS the gate. v2 bumped 2026-06-05 (Story 6-18 F24 closure) — v1 SYSTEM did not enumerate required JSON fields and qwen2.5:3b deterministically dropped `confidence`, blocking 712+ ingest rows on SCHEMA_VALIDATION_FAILED. v3 bumped 2026-06-06 (Story 6-21 F27 closure) — v2's single high-confidence-normal example anchored qwen toward confidence-0.95 normal classifications on multi-signal borderline emails; v3 adds 2 borderline-case examples in the 0.65-0.75 confidence range BEFORE the cautious-bias paragraph to anti-anchor. Pair-shipped with router/sensitivity_patterns.yaml augmentation (2 new force_sensitive regexes) as defense-in-depth."

  draft_reply:
    model: "claude-opus-4-7"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 1500
    lane: "interactive"
    sensitivity: "any"
    notes: "Drafts can contain sensitive content; Epic-4's grant flow gates the send. Interactive-lane so chat reply doesn't wait behind ingest."
    # v1-review (2026-07-04): benchmark_runs.run_id=db48480f-9692-4791-b3e2-4b3a2ab1fed8
    # verdict=INSUFFICIENT_DATA; hypothesis retained because opus scoring returned n=0
    # (no valid Haiku-vs-Opus comparison — scoring-pipeline defect, see
    # 9.5.3-walk-evidence.md § "AC-5 verdict interpretation") AND haiku's absolute
    # subjective_overall=2.6176 (n=34) sits below the ~3.0 hold-steady threshold,
    # arguing AGAINST demotion even on the one-sided data available. Scores are
    # from the pre-leak-fix evaluator run, and the n=34 report rows carry the
    # filed F-COHORT-KEY-LEGACY-SCORE-CONFLATION defect (legacy pre-flight scorer
    # rows conflated under the same cohort_key). Full caveat trail:
    # epic-9-5-retro-2026-07-04.md § "policy.yaml v0→v1".
    demotion_hypothesis: "Haiku v1 may hold quality on short replies under 200 words; demote when corpus shows ≥0.85 calibrated score parity AND p95 latency stays under 8s."
    promotion_hypothesis: null

  fine_class:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 128
    lane: "batch"
    sensitivity: "any"
    notes: "Fine-grained classification (only invoked when class_coarse == 'human'). Local Qwen — Story 3-5 pipeline orchestrator handles the conditional."

  summary_short:
    model: "claude-haiku-4-5-20251001"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 384
    lane: "batch"
    sensitivity: "any"
    notes: "One-line ≤280-char summary. Haiku-bound; sensitive/confidential emails are gated by the Router precondition (SENSITIVITY_BLOCKS_API)."

  importance_scoring:
    model: "claude-haiku-4-5-20251001"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 256
    lane: "batch"
    sensitivity: "any"
    notes: "0..100 importance score + ≤5 signal tags. Haiku-bound; sensitivity-gated."

  action_extraction:
    model: "claude-haiku-4-5-20251001"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 512
    lane: "batch"
    sensitivity: "any"
    notes: "Structured action items with strict ISO-8601 deadline_at format. Haiku-bound; sensitivity-gated."

  sender_reputation_summary:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 256
    lane: "batch"
    sensitivity: "any"
    notes: "Cross-email sender summary. Local Qwen only per Rule F.1 (cross-email aggregation never escapes to Anthropic). Cached forever per Rule A. email_id=None bypasses FR-2.3 precondition; digest excludes confidential bodies entirely + sensitive bodies (subjects only)."

  thread_continuity:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 256
    lane: "batch"
    sensitivity: "any"
    notes: "Multi-message thread continuity note. Local Qwen only. Cached forever. Same digest sensitivity filtering as sender_reputation_summary."

  embedding:
    model: "nomic-embed-text"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 0
    lane: "batch"
    sensitivity: "any"
    notes: "Embedding via Ollama nomic-embed-text. Local-only per FR-2.5; never escapes the device. The Router's dispatch_embedding helper handles routing; ask_router does NOT handle this task type. prompt_version is a sentinel — no prompts/embedding/v1.py module exists."

  hermes_aux:
    model: "claude-haiku-4-5-20251001"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 1024
    lane: "interactive"
    sensitivity: "any"
    notes: "Hermes-aux pass-through via /v1/chat/completions. force_model is overridden by the request body; this entry exists so policy.tasks['hermes_aux'] resolves. Also serves as the LANE PROXY (rate-limit / semaphore accounting) for tool-call dispatch — see chat_completions_tool_call for the MODEL default. Story AI-1 (2026-07-13): the MODEL for a default chat tool-call is NO LONGER sourced from here; it moved to chat_completions_tool_call so the now-tool-capable local lane serves default tool-calls (haiku here would keep every tool-call on the paid lane, defeating the cost thesis)."

  chat_completions_tool_call:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 1024
    lane: "interactive"
    sensitivity: "any"
    notes: "Story AI-1 Phase 2 (2026-07-13, F-10-3-2 reachability last-mile): the MODEL default for a default (non-override) tool-call arriving on /v1/chat/completions. Set to local qwen2.5 — which Story AI-1 Phase 1 made genuinely tool-capable (adapter call_with_tools + router capability gate, live-probed 6/6 exact at temp 0). BEFORE this entry existed, dispatch_tool_call defaulted the model from hermes_aux (haiku), so EVERY chat tool-call landed on the paid lane regardless of the local model's capability — the layer-3 'wired+capable+tested ≠ reached' gap the Epic 10.5 retro named. Routing the default here to qwen makes the cheap local lane genuinely CARRY chat tool-calls end-to-end (the founding 'LLM without high cost' thesis). SAFETY: this only picks the PROPOSING model; whether a resulting tool-call may ACT on the mailbox is enforced downstream + model-independently by the propose_action → drain tier/grant/sensitivity pipeline (reversible Tier-1 proceeds; irreversible Tier-2/3 still require grant + sensitivity handshake at drain, exactly as for a haiku-proposed action). See project_local_model_is_safety_net. Overrides (one-shot / persistent / is_force_override) still win over this default; degraded-mode demotion is a no-op here (qwen is already the floor). prompt_version is a sentinel — tool-call dispatch has no prompt module. Lane accounting still borrows hermes_aux (both interactive, Hermes-driven)."

  # --- Story 5-3: chat-side prompts ---

  intent_parsing_chat:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: true
    max_tokens_out: 384
    lane: "interactive"
    sensitivity: "any"
    notes: "Discord message -> intent + filter. Qwen-first per Rule N (cost discipline); Haiku escalation handles ambiguous parses via Story 2-4 schema-fail-retry. Interactive lane - chat latency matters."

  reference_resolution:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: true
    max_tokens_out: 384
    lane: "interactive"
    sensitivity: "any"
    notes: "Resolve 'that one' / 'the lawyer' references against recent Discord context + sender_reputation_summary + Hermes persistent memory. Qwen-first; Haiku escalation. FR-4.3 >= 90% threshold validated in Epic 7 (Story 7-7) per Story 5-8."

  tone_style_mirror:
    model: "claude-opus-4-7"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 512
    lane: "interactive"
    sensitivity: "any"
    response_cache_ttl_seconds: 2592000  # 30 days; tone evolves slowly
    notes: "Per-recipient tone fingerprint. Invoked ONCE per recipient (cache-keyed on recipient_address) per Story 5-3 AC-5; cache hit avoids the Opus call entirely on subsequent draft_reply turns."
    # v1-review (2026-07-04): NOT covered by the Story 9.5.3 benchmark run
    # (draft_reply-only); hypothesis retained unreviewed for v2 re-review.
    demotion_hypothesis: "Haiku may suffice for tone fingerprinting - demote when Epic 7 measures recipient-level tone accuracy parity."

  multi_turn_refinement:
    model: "claude-opus-4-7"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 1500
    lane: "interactive"
    sensitivity: "any"
    notes: "Iterative draft refinement (Story 5-9). Routes to Opus per FR-4.4. No response cache - refinements are turn-specific."
    # v1-review (2026-07-04): NOT covered by the Story 9.5.3 benchmark run
    # (draft_reply-only); hypothesis retained unreviewed for v2 re-review.
    demotion_hypothesis: "Haiku may suffice for small-delta refinements (e.g., 'make this shorter'); demote when Epic 7 measures refinement quality parity."

  daily_digest_intro:
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 200
    lane: "batch"
    sensitivity: "any"
    response_cache_ttl_seconds: 600
    notes: "Story 6-5: 08:00 digest intro paragraph (≤200 chars). Qwen-served, batch-lane, response-cached 10 min so digest retries within the window re-use the same intro. Input is structured counts only (no email bodies — Rule J)."

  # --- Story 9-7: anchor-calibrated subjective scorer (AC-6) ---

  anchor_calibrated_eval:
    model: "claude-opus-4-7"
    prompt_version: "v1"
    escalate: false
    max_tokens_out: 256
    lane: "batch"
    sensitivity: "any"
    response_cache_ttl_seconds: 86400
    notes: "Story 9-7: strong-model evaluator that scores draft_reply / summary_short outputs 1-5 across rubric axes, calibrated against the 20 hand-anchored examples per task. Dispatched by benchmark/scoring/subjective.py via ask_router(force_model=<scorer>, force=True, caller_origin=benchmark-scorer, email_id=None). 24h response-cache TTL matches Story 9-11 anchor-stability-audit re-run dedup contract — re-scoring within a day reuses prior evaluator dispatches. CR-F1 (HIGH) 2026-06-28: lane=batch (NOT interactive) because a full-corpus scoring run can dispatch ~800 evaluator calls per (task,model) pair (20 anchors + ~100 per-row) which would exhaust the interactive lane's 60 req/hr cap 13× over and RATE_LIMIT real Discord/chat user requests during the run. The scorer is a non-interactive CLI surface — batch lane (300 req/hr) is the correct semantic."
