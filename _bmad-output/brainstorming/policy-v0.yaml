# ============================================================================
# MailBot Router — Initial Policy Draft (v0)
# ============================================================================
# Date:        2026-05-31
# Author:      Adam, brainstorming session
# Status:      DRAFT — starting positions, NOT validated by benchmarks yet.
#              Every non-qwen-3b assignment is a HYPOTHESIS to be tested.
#
# Governing rules (see brainstorming-session-2026-05-31-1430.md):
#   - Rule Ω (Cost Minimality): never use distant LLM if local can do the task;
#                               never use high-grade if low-grade can do the task.
#   - Rule H (Eval-Driven Routing): every cell here must eventually be backed
#                                   by benchmark data. Comments cite hypothesis.
#   - Rule I (Router as SoT): the Router enforces everything in this file.
#   - Rule J (Hydration Discipline): retrieval verbs return projections; full
#                                    bodies require explicit hydrate_email().
#   - Rule K (Lanes): every task has an implicit lane (interactive / batch).
#   - Rule M (Cache Discipline): API tasks should mark SYSTEM as cacheable.
#   - Rule Q (Sensitivity): some tasks are LOCAL-ONLY by definition.
#
# Schema per task:
#   model:          qwen-3b | claude-haiku-4-5 | claude-opus-4-7 | bge-small-local
#   prompt:         version label (resolves to prompts/<task>/<version>.py)
#   escalate:       on persistent parse failure — true = next-tier model, false = error
#   max_tokens_out: hard cap on output tokens (Layer 1 budget enforcement)
#   lane:           interactive | batch  (Rule K)
#   sensitivity:    allowed | local_only  (Rule Q — local_only blocks API entirely)
#   notes:          rationale, demotion hypothesis, anything operationally relevant
# ============================================================================

# ----------------------------------------------------------------------------
# TIER: PREMIUM (Opus) — output reflects on Adam to other humans
# ----------------------------------------------------------------------------

draft_reply:
  model: claude-opus-4-7
  prompt: v1
  escalate: false
  max_tokens_out: 800
  lane: interactive
  sensitivity: allowed   # Rule Q layer: if email is `sensitive`, requires per-session confirm
  notes: >
    The single most quality-critical task. Tone, nuance, contextual awareness
    matter — this is what Adam sends to other humans. Cache SYSTEM aggressively
    (Rule M). DEMOTION HYPOTHESIS: very weak; would only demote if Haiku
    benchmarks show edit-distance parity (Rule O) on draft-edit telemetry.

tone_style_mirror:
  model: claude-opus-4-7
  prompt: v1
  escalate: false
  max_tokens_out: 600
  lane: interactive
  sensitivity: allowed
  notes: >
    Style transfer to match Adam's voice. Coupled to draft_reply; may collapse
    INTO draft_reply's prompt rather than remaining a separate task.
    DEMOTION HYPOTHESIS: medium — Haiku might match if SYSTEM prompt carries
    enough style examples.

user_model_refresh:
  model: claude-opus-4-7
  prompt: v1
  escalate: false
  max_tokens_out: 2000
  lane: batch
  sensitivity: allowed
  notes: >
    Synthesis across weeks of inbox activity → updates "what Adam cares about"
    memory. Cost compounds: better user model = better importance scoring on
    every email forever. Worth the one-off Opus cost. Runs max 1x/month unless
    force=true. DEMOTION HYPOTHESIS: weak — quality of synthesis matters.

# ----------------------------------------------------------------------------
# TIER: CHEAP (Haiku) — structured judgment, multi-doc synthesis, or chat UX
# ----------------------------------------------------------------------------

action_extraction:
  model: claude-haiku-4-5
  prompt: v1
  escalate: true            # → opus on parse fail (missing a deadline is costly)
  max_tokens_out: 300
  lane: batch
  sensitivity: allowed
  notes: >
    Extracts deadlines, asks, soft commitments, calendar invites, payment due.
    3B tends to hallucinate dates and over-extract. DEMOTION HYPOTHESIS:
    medium — bench 3B first; demote if accuracy ≥ 90% on dates + asks.

importance_scoring:
  model: claude-haiku-4-5
  prompt: v1
  escalate: false
  max_tokens_out: 50
  lane: batch
  sensitivity: allowed
  notes: >
    Requires user-model context (what matters to Adam right now). Likely too
    nuanced for 3B even with good prompting. DEMOTION HYPOTHESIS: weak; will
    likely stay on Haiku.

intent_parsing_chat:
  model: claude-haiku-4-5
  prompt: v1
  escalate: false
  max_tokens_out: 100
  lane: interactive
  sensitivity: allowed
  notes: >
    Interactive chat — UX bar < 2s. Haiku is sub-second; 3B on 2-vCPU is 2-5s
    which is borderline. DEMOTION HYPOTHESIS: STRONG — if 3B p95 latency < 1.5s
    AND accuracy ≥ 95% on intent labels, demote.

reference_resolution:
  model: claude-haiku-4-5
  prompt: v1
  escalate: false
  max_tokens_out: 50
  lane: interactive
  sensitivity: allowed
  notes: >
    "That one", "the lawyer", "Marc's last email" — pronoun/reference resolution
    with short-term context + memory recall. Cheap call, needs reliability.
    DEMOTION HYPOTHESIS: medium.

subscription_audit:
  model: claude-haiku-4-5
  prompt: v1
  escalate: false
  max_tokens_out: 1500
  lane: batch
  sensitivity: allowed
  notes: >
    Quarterly synthesis: "you're paying for 14 subscriptions, here's the list".
    Reads dozens of emails (via hydration, Rule J). Opus wasteful; 3B too weak
    for the synthesis. DEMOTION HYPOTHESIS: medium — viable on 3B if input is
    pre-classified subscription_candidate=true and limited to summaries.

bulk_action_proposals:
  model: claude-haiku-4-5
  prompt: v1
  escalate: false
  max_tokens_out: 800
  lane: interactive
  sensitivity: allowed
  notes: >
    "I see 47 newsletters this week, want to triage?" Multi-item reasoning over
    pre-computed summaries (Rule J). Explanation quality matters for trust.
    DEMOTION HYPOTHESIS: STRONG — 3B may handle if summaries are clean.

summarize_long_thread:
  model: claude-haiku-4-5
  prompt: v1
  escalate: true            # → opus if user requests "deep summary"
  max_tokens_out: 600
  lane: interactive
  sensitivity: allowed
  notes: >
    Long context (multiple emails). 3B context window + reasoning won't hold for
    long threads. SHORT threads (≤3 emails, ≤2K tokens) routed via separate
    `summarize_short_thread` task on 3B.

# ----------------------------------------------------------------------------
# TIER: FREE (qwen-3b local) — DEFAULT per Rule Ω
# ----------------------------------------------------------------------------

# --- Ingest pipeline (per-email, batch lane) ---

coarse_class:
  model: qwen-3b
  prompt: v1
  escalate: false           # misclass is recoverable; want to see 3B failure rate
  max_tokens_out: 100
  lane: batch
  sensitivity: allowed
  notes: >
    Coarse classification: transactional / newsletter / human / notification /
    spam_like / unknown. Core ingest step. Cached forever (Rule A).

fine_class:
  model: qwen-3b
  prompt: v1
  escalate: true            # → haiku on parse fail — borderline within "human"
  max_tokens_out: 100
  lane: batch
  sensitivity: allowed
  notes: >
    Fine class within "human": personal / professional / cold outreach /
    automated-but-human-looking. PROMOTION HYPOTHESIS: may need Haiku if 3B
    can't tell cold outreach from real prospects.

sensitivity_class:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 30
  lane: batch
  sensitivity: local_only   # Rule Q: by definition cannot leave the box
  notes: >
    Classifies email sensitivity → normal / sensitive / confidential.
    HARD CONSTRAINT: must be local. Anthropic API never sees an email that
    hasn't been sensitivity-classified yet. When uncertain, default to
    `sensitive` (Rule Ω: cautious bias).

auto_file_decision:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 50
  lane: batch
  sensitivity: allowed
  notes: >
    Which folder? archive? leave in inbox? Tier 1/2 action (Rule P).

unsubscribe_candidate:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 50
  lane: batch
  sensitivity: allowed
  notes: >
    Is this noise worth unsubscribing from, not just deleting?
    Tier 2 action — proposes batch for approval.

notification_decision:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 30
  lane: batch
  sensitivity: allowed
  notes: >
    Push to chat now? include in digest? silent? Rules + 3B tiebreaker.

thread_continuity:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 50
  lane: batch
  sensitivity: allowed
  notes: >
    Is this part of an ongoing thread Adam cares about? Memory lookup +
    small LLM tiebreaker.

summary_short:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 200
  lane: batch
  sensitivity: allowed
  notes: >
    Per-email short summary, computed at ingest, cached forever (Rule A).
    Powers later chat queries cheaply. Foundation of Rule J hydration model.

summarize_short_thread:
  model: qwen-3b
  prompt: v1
  escalate: true            # → haiku if thread length exceeds context cleanly
  max_tokens_out: 400
  lane: interactive
  sensitivity: allowed
  notes: >
    Short threads (≤3 emails, ≤2K tokens). 3B comfortable here.

sender_reputation_summary:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 100
  lane: batch
  sensitivity: allowed
  notes: >
    On new sender (first email): 3B generates a one-line description from the
    email content. Updates the senders table. Cached forever.

# --- Background / cron (batch lane) ---

daily_digest:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 800
  lane: batch
  sensitivity: allowed
  notes: >
    Built entirely from pre-computed columns (Rule A). 3B's job is light
    re-templating, not synthesis from raw bodies. Should be cheap and fast.

anomaly_detection:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 100
  lane: batch
  sensitivity: allowed
  notes: >
    Unknown-country login alerts, currency mismatch on invoices, etc. Mostly
    rule-based; 3B is the tiebreaker on ambiguous signals.

promised_reply_check:
  model: qwen-3b
  prompt: v1
  escalate: false
  max_tokens_out: 100
  lane: batch
  sensitivity: allowed
  notes: >
    "Adam said he'd reply, he hasn't." Cron task, reads memory + recent emails.

# --- Chat interaction (interactive lane) ---

multi_turn_refinement:
  model: qwen-3b
  prompt: v1
  escalate: true            # → haiku on parse fail; → opus only if `force_model`
  max_tokens_out: 600
  lane: interactive
  sensitivity: allowed
  notes: >
    "Make that draft shorter / warmer / more formal." Iterative edits on text
    already produced. 3B is plausible for simple edits; escalates for nuance.

# ----------------------------------------------------------------------------
# NON-LLM (or embedding-only) — listed for completeness
# ----------------------------------------------------------------------------

embedding:
  model: bge-small-local
  prompt: n/a
  escalate: false
  max_tokens_out: n/a
  lane: batch
  sensitivity: local_only
  notes: >
    Embed every email at ingest. ~100 MB resident, near-free CPU cost.
    Enables semantic search over the SQL mailbox. Vectors stored in SQL
    (Rule A — cached forever).

# ============================================================================
# OPERATIONAL NOTES
# ============================================================================
#
# Budget guards (Rule N + budget layers, NOT per-task — system-wide):
#   - monthly_cap_usd:           30.00
#   - daily_warn_threshold_usd:  2.00
#   - per_call_refusal_usd:      0.20
#   - degraded_mode_demotion:    opus → haiku → qwen-3b
#
# Rate limits (Rule N, per (task, caller_verb), per hour):
#   - chat_tasks:        60/hr
#   - ingest_tasks:      300/hr  (with backpressure if queue > 500)
#   - escalations:       20/hr   (circuit-breaker if exceeded → pause escalations)
#
# Anti-loop:
#   - prompt_hash_repeat_window: 10 calls / 5 min → refuse + alert
#
# Sensitivity routing (Rule Q) is enforced by the Router, NOT by task config:
#   - normal       → policy file as-is
#   - sensitive    → qwen-3b only by default; API requires per-session chat confirm
#   - confidential → qwen-3b only, always
#
# Cache warmer (Rule M):
#   - Pings ping every 4 minutes for high-volume task SYSTEM blocks
#   - Cache TTL = 5 min; ingest cron also runs every 4 min (aligned)
#
# Continuous eval (Rule L):
#   - Weekly: 5 random router_calls sampled for human labeling (chat prompt)
#   - Weekly: distribution drift report on coarse_class vs. eval corpus
#
# ============================================================================
# CALIBRATION PROCESS (Phase 4 will deliver the tooling for this)
# ============================================================================
#
# Per Adam (2026-05-31): "During development we will do measurements and
# experiments to see if the draft is correctly calibrated or modify things."
#
# Calibration cadence:
#   1. Build eval corpus v1 (~100 labeled emails, manual, one-time)
#   2. Run benchmark/runner.py over ALL tasks × ALL three models
#   3. Generate dashboard: accuracy × latency × cost per (task, model)
#   4. For each Haiku/Opus row: check DEMOTION HYPOTHESIS — if benchmarks
#      show qwen-3b meets the threshold, edit this file (demote, bump version).
#   5. For each qwen-3b row with escalate=true: check escalation rate after
#      first week of prod data. If > 30%, the PROMOTION HYPOTHESIS won; bump
#      this file to the escalated tier as default.
#   6. Repeat at every prompt version change (and quarterly).
#
# This file IS the artifact that captures the agent's cost discipline.
# Every change to it should be a deliberate, evidence-backed act.
