# Hermes container config — Story 5-4.
#
# Loaded by nousresearch/hermes-agent:latest at container startup. Path inside
# the container: /opt/data/config.yaml (bind-mounted from this repo's
# hermes-config/ via docker-compose.yml).
#
# All secret-bearing fields use ${ENV_VAR} substitution; Hermes resolves them
# against the container's environment at startup. NEVER hard-code secrets here.

# --- Main provider: Hermes's primary inference path ---
#
# Routes through mailbot-api's OpenAI-compatible /v1/chat/completions
# (Story 2-10). `hermes_aux` is a Router alias (see router/policy.yaml's
# hermes_aux task entry); the actual backend model is selected per policy
# at dispatch time. Re-tune Hermes's main inference by editing policy.yaml,
# not this file.
provider:
  base_url: "http://mailbot-api:8000/v1"
  model: "hermes_aux"
  api_key: "${MAILBOT_ROUTER_KEY}"

# --- Auxiliary providers: Hermes-internal helper calls ---
#
# Both route through the same mailbot-api endpoint but tag themselves via
# `X-Mailbot-Caller-Origin` so the Router's router_calls table can distinguish
# the workloads for cost-discipline forensics (Story 2-10's caller_origin
# propagation). These tags MUST match exactly what router_calls.caller_origin
# expects: drift breaks the cost-attribution dashboards.
auxiliary:
  compression:
    provider: "custom"
    base_url: "http://mailbot-api:8000/v1"
    model: "hermes_aux"
    api_key: "${MAILBOT_ROUTER_KEY}"
    headers:
      X-Mailbot-Caller-Origin: "hermes-aux-compression"
  title_generation:
    provider: "custom"
    base_url: "http://mailbot-api:8000/v1"
    model: "hermes_aux"
    api_key: "${MAILBOT_ROUTER_KEY}"
    headers:
      X-Mailbot-Caller-Origin: "hermes-aux-title"

# --- Fallback providers: NFR-OPS-6 emergency-only ---
#
# When mailbot-api is hard-down for > 10 minutes (Router unreachable, health
# check failing, container restart-looping), Hermes switches to this entry
# rather than going dark. This BYPASSES the Router's cost discipline by
# design — it's the documented exception to Rule F.1 (agent never holds the
# Anthropic key under normal operation). See .env.example for the operational
# warning that accompanies the ANTHROPIC_API_KEY env var on the Hermes side.
fallback_providers:
  - provider: "anthropic"
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-7"
    api_key: "${ANTHROPIC_API_KEY}"
    notes: "NFR-OPS-6 emergency-only — bypasses Router cost discipline by design. Used when mailbot-api is hard-down for > 10 minutes."

# --- Discord gateway adapter ---
#
# bot_token is captured at Discord Developer Portal time. MESSAGE_CONTENT is
# a privileged intent and MUST be enabled in the portal for the bot. Adam's
# bot is in a single private server (< 100 servers), so no Discord approval
# is required for the privileged intent. Extra intents beyond the four below
# are deliberately omitted (unnecessary attack surface per Story 5-4 AC-1).
gateway:
  discord:
    bot_token: "${DISCORD_BOT_TOKEN}"
    intents:
      - "DIRECT_MESSAGES"
      - "MESSAGE_CONTENT"
      - "GUILDS"
      - "GUILD_MESSAGES"
    # --- Story 5-6: slash command registry ---
    #
    # Each entry maps a Discord slash command to an MCP verb on mailbot-api.
    # ephemeral=true means responses are visible only to the invoking user
    # (FR-4.8 — required for /cost, /budget reset, /confirm which surface
    # cost / budget / sensitivity-token data that must not leak in shared
    # channels). ephemeral=false posts publicly in the channel.
    #
    # Schema reference: hermes-config/skills/mailbot/SKILL.md walks the verb
    # surface; SOUL.md + AGENTS.md set the defender voice + Rule P tier
    # enforcement that the dispatcher honors.
    slash_commands:
      - name: "cost"
        description: "Show Router cost breakdown for the period."
        options:
          - name: "period"
            type: "string"
            choices: ["today", "month"]
            required: false
        verb: "cost_breakdown"
        ephemeral: true
      - name: "pause"
        description: "Pause the Router lane scheduler with a reason."
        options:
          - name: "reason"
            type: "string"
            required: false
        verb: "pause_router"
        ephemeral: false
      - name: "resume"
        description: "Resume the Router lane scheduler."
        verb: "resume_router"
        ephemeral: false
      - name: "cancel"
        description: "Cancel a pending action by action_id (during cooling-off only)."
        options:
          - name: "action_id"
            type: "integer"
            required: true
        verb: "cancel_action"
        ephemeral: false
      - name: "mute"
        description: "Mute a notification category."
        options:
          - name: "category"
            type: "string"
            required: true
          - name: "muted_until"
            type: "string"
            description: "UTC ISO-8601 Z; omit for indefinite."
            required: false
        verb: "mute_category"
        ephemeral: false
      - name: "label"
        description: "Apply a local-category label to recent emails."
        options:
          - name: "recent"
            type: "integer"
            description: "How many recent emails to label."
            required: true
          - name: "label"
            type: "string"
            required: true
        verb: "propose_action"  # dispatched as ActionType.ADD_LOCAL_CATEGORY per Story 5-6 AC-7
        ephemeral: false
      - name: "budget"
        description: "Budget admin commands."
        subcommands:
          - name: "reset"
            description: "Reset degraded mode (exit) and clear the in-memory flag."
            verb: "reset_degraded_mode"
            ephemeral: true
      - name: "confirm"
        description: "Mint a sensitivity token for a sensitive email + task_type."
        options:
          - name: "email_id"
            type: "string"
            required: true
          - name: "task_type"
            type: "string"
            required: true
        verb: "mint_sensitivity_token"
        ephemeral: true

# --- MCP clients: tool dispatch surface ---
#
# Connects to mailbot-api's /mcp endpoint (Story 5-2's FastMCP 1.27.2
# streamable-HTTP mount). The 11 verbs from Story 5-2 are auto-discovered
# via the MCP list_tools handshake.
#
# MCP auth is out of scope here (per Story 5-2 Dev Notes); the trust boundary
# is mailbot-net itself — only containers on that network can reach /mcp.
# Adding bearer auth here would require coordinating a separate key between
# this file and mailbot-api's lifespan; deferred to a follow-up story if
# Adam decides to expose the network beyond mailbot-net.
mcp_clients:
  - name: "mailbot-api"
    url: "http://mailbot-api:8000/mcp"
    transport: "streamable_http"
