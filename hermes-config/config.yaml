# Hermes container config — Story 6-0 rewrite against real Hermes schema.
#
# Loaded by nousresearch/hermes-agent:latest at container startup. The image
# pins ENV HERMES_HOME=/opt/data, so the path inside the container is
# /opt/data/config.yaml (bind-mounted from this repo's hermes-config/ via
# docker-compose.yml).
#
# This file replaces the Story 5-4 invention with the documented Hermes
# schema. See docs/external/hermes-agent/RECONCILIATION-NOTES.md for the
# full schema-to-schema mapping and the divergence table.
#
# All secret-bearing fields use ${ENV_VAR} substitution; Hermes resolves
# them against /opt/data/.env + the container environment at startup.
# NEVER hard-code secrets here.

# --- Main provider: Hermes's primary inference path ---
#
# Routes through mailbot-api's OpenAI-compatible /v1/chat/completions
# endpoint (Story 2-10) using Hermes's "custom" provider mode. `hermes_aux`
# is a Router task type (see router/policy.yaml's hermes_aux entry); the
# actual backend model is selected per policy at dispatch time. Re-tune
# Hermes's main inference by editing policy.yaml, not this file.
model:
  default: "hermes_aux"
  provider: "custom"
  base_url: "http://mailbot-api:8000/v1"
  api_key: "${MAILBOT_ROUTER_KEY}"
  # context_length: leave unset — Hermes auto-detects from the provider.
  # request_timeout_seconds: leave unset (default 1800s); mailbot-api
  # streams responses so the default is fine.

# --- Auxiliary helper-model calls ---
#
# Each auxiliary task family (compression, title_generation, etc.) gets
# its own provider/model config. Hermes calls these for context-window
# management, conversation titling, and other internal jobs. We route
# all of them through mailbot-api so the Router sees every LLM call
# (Rule Ω end-to-end), even Hermes-internal ones.
#
# NOTE on caller_origin granularity loss: Story 5-4 attempted to
# distinguish aux call types via X-Mailbot-Caller-Origin headers, but
# the real Hermes schema does NOT support a `headers:` key on auxiliary
# entries. Until a follow-up story adds distinct `hermes_aux_compression`
# and `hermes_aux_title` task types to policy.yaml, every auxiliary call
# lands in router_calls with caller_origin="hermes_aux" — aggregate cost
# discipline holds, sub-distinction is lost. See RECONCILIATION-NOTES §1.6.
auxiliary:
  compression:
    provider: "custom"
    base_url: "http://mailbot-api:8000/v1"
    model: "hermes_aux"
    api_key: "${MAILBOT_ROUTER_KEY}"
  title_generation:
    provider: "custom"
    base_url: "http://mailbot-api:8000/v1"
    model: "hermes_aux"
    api_key: "${MAILBOT_ROUTER_KEY}"

# --- NFR-OPS-6 fallback chain ---
#
# Story 5-4 shipped a top-level `fallback_providers:` block. Real Hermes
# does NOT load fallback chains from config YAML; they are managed via
# the `hermes fallback` CLI (`hermes fallback add anthropic claude-opus-4-7`
# etc.). The chain persists to config-managed storage but under a key
# the operator-level CLI owns.
#
# Operational setup: at first deploy, exec into the mailbot-hermes container
# and run `hermes fallback add anthropic claude-opus-4-7` interactively
# (also requires ANTHROPIC_API_KEY in /opt/data/.env). This is captured as a
# carry-forward to Story 6-7's setup_vps.sh runbook (see
# RECONCILIATION-NOTES §6 item 3).

# --- MCP servers (Hermes consuming mailbot-api's /mcp endpoint) ---
#
# Hermes connects to mailbot-api's FastMCP server (Story 5-2) and
# auto-registers all 19 verb tools (Story 6-8 added `render_spend_chart`;
# Story 6-3 added `pull_pending_notifications` + `ack_notification` for the
# urgent-notification pull-based delivery surface). Tool names get prefixed
# `mcp_mailbot-api_<verb_name>` inside the Hermes agent's tool registry
# (e.g., `find_emails` → `mcp_mailbot-api_find_emails`). The Discord-side
# dispatcher and any test harness must use the prefixed names.
#
# MCP auth: Story 5-2 deferred bearer-auth enforcement on `mailbot-api`'s
# Starlette `/mcp` Mount — `_check_bearer_auth()` only protects
# `/v1/chat/completions`. Until that gate ships, the trust boundary is
# mailbot-net itself.
#
# TODO(auth): the `Authorization: "Bearer ..."` header below is a
# forward-compat PLACEHOLDER. Hermes sends it; mailbot-api currently ignores
# it. When the MCP bearer-auth gate ships (a follow-up story), this header
# becomes load-bearing and MAILBOT_ROUTER_KEY must match on both sides.
# Keeping the header here now means no config change is needed when the
# gate lands. Story 6-0 CR-2 decision: ship as placeholder, documented.
mcp_servers:
  mailbot-api:
    # Story 6-6.6 F6 closure: URL MUST include trailing slash. FastAPI's
    # `app.mount("/mcp", ...)` requires `/mcp/` to match the Mount routing
    # without going through a 307 redirect; without the slash, Starlette
    # issues `307 Temporary Redirect → /mcp/`, and Hermes's MCP client
    # does NOT follow redirects on its bidirectional POST transport (gives
    # up after 3 attempts with `MCP server 'mailbot-api' initial connection
    # failed`). The paired server-side fix is `streamable_http_path="/"` on
    # FastMCP construction (defeats the inner-Starlette-Route double-mount).
    url: "http://mailbot-api:8000/mcp/"
    headers:
      Authorization: "Bearer ${MAILBOT_ROUTER_KEY}"  # TODO(auth) — see comment above
    enabled: true
    # Story 10-6-4 (F-10-6-1-W1, Seam B): the MCP tool-execution call is a
    # separate timeout from the inference dispatch. On the cold-first-call turn
    # (qwen resident but the prompt cache not yet warm, ~20s ingest) a tool
    # round can bump the old 30s ceiling and trip a spurious cutoff independent
    # of the adapter fix. Align it with the adapter's new default budget
    # (OLLAMA_TIMEOUT_SECONDS=120) so a slow-but-legitimate cold turn is not
    # severed here. The load-bearing latency fix is Seam A (adapter keep_alive);
    # this is the belt-and-suspenders tolerance band on the Hermes side.
    timeout: 120
    connect_timeout: 10

# --- Per-turn tool-surface allow-list (Story 10-6-5, WALK-10-6-4-F1) ---
#
# Hermes resolves the per-turn Discord tool surface from this key
# (hermes_cli/tools_config.py `_get_platform_tools` / `_save_platform_tools`).
# When `platform_toolsets.discord` holds an explicit list of configurable
# toolset keys, ONLY those toolsets are enabled (direct membership); MCP
# server names listed alongside (mailbot-api) are preserved separately.
#
# WHY THIS EXISTS: the 10-6-4 Adam-typed Discord walk (WALK-10-6-4-F1) proved a
# real "find my unread emails" turn ran on qwen (outcome=ok, latency fix works)
# but emitted tool_calls_count=0 — qwen was handed the built-in TTS / task /
# image / write-file toolsets from Hermes's default swarm, so the 26 registered
# mailbot-api email verbs never dominated the surface. `hermes tools list
# --platform discord` showed web/browser/terminal/file/code_execution/vision/
# image_gen/tts/todo/… all enabled. Without this allow-list Hermes defaults the
# whole swarm on; with it, only a MailBot email turn's toolsets reach the model.
#
# KEEP-SET rationale:
#   - mailbot-api : the 26 email verbs (the whole point; MCP server name)
#   - messaging   : Rule R cross-platform notification send
#   - cronjob     : Story 6-10 digest + notification-pull jobs run attached skills
#   - memory      : defender-persona session hygiene
#   - clarify     : AGENTS.md "when in doubt, ask for clarification" tiebreaker
# Everything else is dropped — the built-in noise (tts/image_gen/vision/video/
# file/browser/terminal/code_execution/web/todo/delegation/computer_use) that
# WALK-10-6-4-F1 observed, PLUS the `skills` toolset.
#
# WHY `skills` IS DROPPED (learned at the 10-6-5 AC-1 live walk 2026-07-14):
# the `skills` toolset does NOT merely surface list/view/manage meta-tools — at
# turn time it resolves the installed 88-skill catalog's tools into the model's
# function list, including a competing `gmail_get_unread_emails` (Google-
# Workspace skill). On "find my unread emails" qwen picked `gmail_get_unread_
# emails` + `skills_list` (router_calls id=14913/14914, tool_calls_count=1) and
# NEVER reached the MailBot `find_emails` verb — a DIFFERENT pollution channel
# than the built-in toolsets, invisible to `hermes tools list` (which shows only
# toolset NAMES, not their turn-time tool expansion). Keeping `skills` kept that
# channel open. Dropping it leaves the mailbot-api MCP verbs as the dominant
# email surface. The MailBot SKILL.md persona reference is injected via the
# separate `.skills_prompt_snapshot.json` mechanism, NOT the `skills` toolset —
# so dropping the toolset does not cost the persona its verb reference.
#
# VERIFY (runbook carry-forward for CP-1, like `hermes fallback add`):
#   docker exec mailbot-hermes hermes tools list --platform discord
# Restart the mailbot-hermes container after editing so the key takes effect;
# restart hermes after any mailbot-api restart before a walk (F-10-5-1-W2).
#
# CR-10-6-5-4 (RESOLVED at the 2026-07-14 AC-1 live walk): the reviewer flagged
# that keeping `skills` rested on the assumption it exposed only meta-tools, not
# offline-verifiable. The live walk DISPROVED the assumption (the `skills`
# toolset resolved `gmail_get_unread_emails` onto the surface and qwen picked it
# over the MailBot verbs) — so `skills` was DROPPED from the allow-list (see the
# "WHY `skills` IS DROPPED" note above). The residual is closed by removal, not
# accepted. Standing guard for any FUTURE surface regression stays the same:
# `hermes tools list --platform discord` + the AC-6 live re-walk before deploy.
platform_toolsets:
  discord:
    - mailbot-api
    - messaging
    - cronjob
    - memory
    - clarify

# --- Discord gateway behavior ---
#
# Discord-side env vars (DISCORD_BOT_TOKEN, DISCORD_ALLOWED_USERS,
# DISCORD_HOME_CHANNEL) live in .env per the real schema. The bot's
# privileged intents (MESSAGE_CONTENT, Server Members) must be enabled
# at the Discord Developer Portal — they are NOT declared in this file.
#
# Slash commands are auto-registered from installed Hermes skills, NOT
# from this config file (real Hermes contract). Story 5-6's 8-command
# registry needs to migrate to a skill bundle under
# hermes-config/skills/mailbot/ in a follow-up story
# (RECONCILIATION-NOTES §6 item 1).
#
# Behavioral keys below tune Hermes's Discord engagement defaults for
# MailBot's single-user Adam-only deploy.
discord:
  require_mention: false      # Single-user DM-first deploy — no @mention needed
  thread_require_mention: false
  free_response_channels: ""  # No public channels; DMs only
  auto_thread: false          # Single-user; no thread auto-creation needed
  reactions: true             # Defender-acknowledgment hookup
  ignored_channels: []
  no_thread_channels: []
  history_backfill: true
  history_backfill_limit: 50
  channel_prompts: {}
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

# Story 9-3 OQ-2 (Adam-decided 2026-06-16): the original AC-4 spec called
# for adding `discord.slash_commands[]` here, but `test_hermes_config_
# discord_at_top_level_not_under_gateway` documents that `slash_commands`
# was a Story 5-4 invention — real Hermes registers Discord slash commands
# at runtime via the Discord Developer Portal, NOT via config.yaml. The
# fictional 5-6 path is filed as Story 9-10's drift work; this story
# documents the `/model` command in SKILL.md only, and Adam registers it
# manually via the Discord bot's Developer Portal (or Story 9-10 will
# introduce a runtime-registration mechanism). The verb itself
# (`set_model_oneshot`) IS dispatchable today via MCP — Hermes can
# invoke it programmatically from any slash-command handler that gets
# wired up later.
#
# Story 9-4 (Adam-confirmed 2026-06-26): same architectural-impossibility
# constraint applies — the new `set_model_persistent` + `inspect_policy`
# verbs are documented in SKILL.md only. The single `/model` slash
# command dispatches three behaviors based on argument count (0 args →
# inspect, 1 arg → one-shot, 2 args → persistent); the dispatch logic
# lives in the Hermes-side handler once Story 9-10 wires it up. Both new
# verbs are MCP-dispatchable today.

# Per-user session isolation in shared channels (Adam-only deploy, but
# keeping the default so a future second-user case doesn't surprise us).
group_sessions_per_user: true

# --- Streaming responses ---
#
# Edit-in-place transport for Discord message updates while Hermes
# generates. Defaults are fine.
streaming:
  enabled: true
  transport: "edit"

# --- Memory + agent budget defaults are fine; not overridden here ---
