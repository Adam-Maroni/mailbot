# MailBot 3-container Docker Compose stack per architecture §"3-container Docker Compose stack".
# Production-shape: no source bind-mounts, no host port maps except what's strictly needed.
# docker-compose.override.yml layers on dev source bind-mounts + dev port exposure.

services:
  mailbot-hermes:
    image: nousresearch/hermes-agent:latest  # per architecture AR-DEPLOY-1
    container_name: mailbot-hermes
    # Story 6-0 (Hermes runtime corrective): CMD passes through
    # /opt/hermes/docker/main-wrapper.sh which routes any non-executable
    # first arg as a `hermes` subcommand. `gateway run` is the documented
    # Docker daemon mode (per `hermes gateway run --help`); inside the
    # s6-overlay image it auto-engages supervision so the gateway gets
    # auto-restart on crash. Closes Epic 5 F3 + F4.
    # See docs/external/hermes-agent/RECONCILIATION-NOTES.md for the full
    # docs-says vs image-says reconciliation.
    command: ["gateway", "run"]
    networks:
      - mailbot-net
    volumes:
      # Story 1-2 baseline volume (architecture §"3-container Docker Compose
      # stack"). Kept declared for the named-volume guarantee even though the
      # real Hermes image's HOME is /opt/data (bind-mount below), not /data.
      # Hermes does not write to /data under the rewritten config.
      - mailbot_hermes_data:/data
      - mailbot_logs:/var/log/mailbot
      # Bind-mount hermes-config/ at /opt/data (HERMES_HOME inside the
      # image). Read-write because the image's cont-init hook needs to
      # mkdir runtime sub-dirs (cron/, sessions/, memories/, logs/,
      # skills/). Hermes-written runtime files are gitignored via
      # hermes-config/.gitignore.
      - ./hermes-config:/opt/data
    environment:
      # The bearer key mailbot-api validates on /v1/chat/completions and /mcp.
      - MAILBOT_ROUTER_KEY=${MAILBOT_ROUTER_KEY:-}
      # Discord-side credentials (real Hermes contract — env-driven, NOT
      # config.yaml-driven).
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS:-}
      - DISCORD_HOME_CHANNEL=${DISCORD_HOME_CHANNEL:-}
      # NFR-OPS-6 emergency-only fallback to api.anthropic.com when
      # mailbot-api is hard-down. Bypasses Router cost discipline by design.
      # Wired into Hermes's fallback chain via `hermes fallback add` CLI at
      # first deploy (NOT from config.yaml — real Hermes contract).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Defensive: the image sets HERMES_HOME=/opt/data via Dockerfile ENV;
      # repeating here for clarity and to survive any host-side env shadow.
      - HERMES_HOME=/opt/data
      # PUID / PGID passthrough — let operators align the supervised hermes
      # user (default UID 10000) with the host user that owns the bind-mounted
      # ./hermes-config/ directory. Without this, the image's cont-init hook
      # (/opt/hermes/docker/stage2-hook.sh) chowns /opt/data to UID 10000 and
      # the host-side files flip ownership between restarts. On a native Linux
      # VPS, set PUID=$(id -u mailbot) PGID=$(id -g mailbot) in .env so the
      # mailbot service user (created by Story 6-7's setup_vps.sh) matches.
      # See RECONCILIATION-NOTES §2.5.
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    depends_on:
      mailbot-api:
        condition: service_healthy
    restart: unless-stopped

  mailbot-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.mailbot-api
    container_name: mailbot-api
    networks:
      - mailbot-net
    volumes:
      - mailbot_db:/data
      - mailbot_logs:/var/log/mailbot
    environment:
      # mailbot-api holds the Anthropic key (Rule F.1)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID:-}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET:-}
      - OUTLOOK_TENANT_ID=${OUTLOOK_TENANT_ID:-}
      - OUTLOOK_REFRESH_TOKEN=${OUTLOOK_REFRESH_TOKEN:-}
      - MAILBOT_DB_PATH=/data/mailbot.db
      - OLLAMA_URL=http://ollama:11434
      - MAILBOT_ROUTER_KEY=${MAILBOT_ROUTER_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:0.6.2  # pinned to match anthropic/ollama Python SDK pin per AR-BOOT-2
    container_name: mailbot-ollama
    networks:
      - mailbot-net
    volumes:
      - mailbot_ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Story 2-3 AC-10: pre-pull the two models the Router + ingest pipeline need.
  # Idempotent — `ollama pull` is a no-op when the model is already present
  # in the named volume.
  ollama_model_warmup:
    image: ollama/ollama:0.6.2
    container_name: mailbot-ollama-warmup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - mailbot-net
    volumes:
      - mailbot_ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen2.5:3b-instruct-q4_K_M && \
        ollama pull nomic-embed-text && \
        echo "model warmup complete"
    restart: "no"

networks:
  mailbot-net:
    name: mailbot-net
    driver: bridge

volumes:
  mailbot_db:
    name: mailbot_db
  mailbot_ollama:
    name: mailbot_ollama
  mailbot_hermes_data:
    name: mailbot_hermes_data
  mailbot_logs:
    name: mailbot_logs
