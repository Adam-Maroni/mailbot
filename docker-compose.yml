# MailBot 3-container Docker Compose stack per architecture §"3-container Docker Compose stack".
# Production-shape: no source bind-mounts, no host port maps except what's strictly needed.
# docker-compose.override.yml layers on dev source bind-mounts + dev port exposure.

services:
  mailbot-hermes:
    image: nousresearch/hermes-agent:latest  # per architecture AR-DEPLOY-1
    container_name: mailbot-hermes
    # Story 6-0 (Hermes runtime corrective): CMD passes through
    # /opt/hermes/docker/main-wrapper.sh which routes any non-executable
    # first arg as a `hermes` subcommand. `gateway run` is the documented
    # Docker daemon mode (per `hermes gateway run --help`); inside the
    # s6-overlay image it auto-engages supervision so the gateway gets
    # auto-restart on crash. Closes Epic 5 F3 + F4.
    # See docs/external/hermes-agent/RECONCILIATION-NOTES.md for the full
    # docs-says vs image-says reconciliation.
    command: ["gateway", "run"]
    networks:
      - mailbot-net
    volumes:
      # Story 1-2 baseline volume (architecture §"3-container Docker Compose
      # stack"). Kept declared for the named-volume guarantee even though the
      # real Hermes image's HOME is /opt/data (bind-mount below), not /data.
      # Hermes does not write to /data under the rewritten config.
      - mailbot_hermes_data:/data
      - mailbot_logs:/var/log/mailbot
      # Bind-mount hermes-config/ at /opt/data (HERMES_HOME inside the
      # image). Read-write because the image's cont-init hook needs to
      # mkdir runtime sub-dirs (cron/, sessions/, memories/, logs/,
      # skills/). Hermes-written runtime files are gitignored via
      # hermes-config/.gitignore.
      - ./hermes-config:/opt/data
      # Story 10.5.2 AC-2 (F-10-5-12 closure): the mailbot skill files are
      # gitted source-of-truth, NOT agent-writable state. Epic 10's walk found
      # the agent self-editing SKILL.md via `skill_manage patch` / `file write`
      # mid-turn with confabulated content, landing in the working tree through
      # this RW bind-mount. A nested read-only mount on just skills/mailbot makes
      # those writes structurally impossible at the filesystem boundary while
      # /opt/data stays RW for Hermes's legitimate runtime dirs (cron/, sessions/,
      # .cache, .skills_prompt_snapshot.json, etc.). Defense-at-the-boundary,
      # independent of Hermes tool-config (which this image exposes no toolset-
      # restriction key for). Verified live: a write probe inside the container
      # is rejected.
      - ./hermes-config/skills/mailbot:/opt/data/skills/mailbot:ro
    environment:
      # The bearer key mailbot-api validates on /v1/chat/completions and /mcp.
      - MAILBOT_ROUTER_KEY=${MAILBOT_ROUTER_KEY:-}
      # Discord-side credentials (real Hermes contract — env-driven, NOT
      # config.yaml-driven).
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS:-}
      - DISCORD_HOME_CHANNEL=${DISCORD_HOME_CHANNEL:-}
      # NFR-OPS-6 emergency-only fallback to api.anthropic.com when
      # mailbot-api is hard-down. Bypasses Router cost discipline by design.
      # Wired into Hermes's fallback chain via `hermes fallback add` CLI at
      # first deploy (NOT from config.yaml — real Hermes contract).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Defensive: the image sets HERMES_HOME=/opt/data via Dockerfile ENV;
      # repeating here for clarity and to survive any host-side env shadow.
      - HERMES_HOME=/opt/data
      # PUID / PGID passthrough — let operators align the supervised hermes
      # user (default UID 10000) with the host user that owns the bind-mounted
      # ./hermes-config/ directory. Without this, the image's cont-init hook
      # (/opt/hermes/docker/stage2-hook.sh) chowns /opt/data to UID 10000 and
      # the host-side files flip ownership between restarts. On a native Linux
      # VPS, set PUID=$(id -u mailbot) PGID=$(id -g mailbot) in .env so the
      # mailbot service user (created by Story 6-7's setup_vps.sh) matches.
      # See RECONCILIATION-NOTES §2.5.
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      # Display timezone for `date`, log timestamps, and Hermes cron evaluation.
      # All MailBot Python code uses tz=timezone.utc explicitly (architecture
      # §AR-PAT-3) so this only affects human-facing time AND Hermes's
      # native-cron schedule interpretation (per Story 6-10 cron-jobs.md,
      # the 08:00 daily digest cron is documented as Paris-local with TZ set).
      - TZ=Europe/Paris
    depends_on:
      mailbot-api:
        condition: service_healthy
    restart: unless-stopped

  mailbot-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.mailbot-api
    container_name: mailbot-api
    networks:
      - mailbot-net
    volumes:
      - mailbot_db:/data
      - mailbot_logs:/var/log/mailbot
      # Story 9-1: bind-mount the routing policy files.
      # - Baseline (read-only): source-of-truth, gitted, single ground truth.
      #   This ALSO closes the latent production gap discovered at Story 9-1
      #   create-story time — the Dockerfile does not COPY router/, so until
      #   this bind-mount existed, policy.yaml would have been missing in
      #   production deploys (dev mode was masked by docker-compose.override).
      # - Overrides (read-write): operator-state, gitignored, written by Story
      #   9-4 set_model_persistent via atomic os.replace().
      #
      # Story 9.5.2 Run 3 (Path B, 2026-07-03): the router/ directory is
      # bind-mounted as a whole so `os.replace()` in
      # write_user_overrides_atomic() works against the override file. Docker's
      # single-file bind-mount pins the target inode, which makes `os.replace`
      # fail with EBUSY (errno=16) — atomic rename cannot cross a bind-mount
      # boundary. A directory-level bind-mount keeps atomic writes on the same
      # filesystem inside the mounted directory, so `os.replace(tmpfile,
      # policy.user-overrides.yaml)` succeeds. The file-level `:ro` overlay for
      # `policy.yaml` still enforces read-only at the file-mount layer (Docker
      # file-mounts take precedence over dir-mounts for the specific inode),
      # so the shipped-policy-never-mutated invariant (Story 9-4 AC-2) is
      # preserved.
      #
      # The host-side `router/policy.user-overrides.yaml` MUST exist as a file
      # (even empty) BEFORE first `docker compose up`. See `router/policy.user-
      # overrides.yaml.example` for the operator-facing template.
      - ./router:/app/router
      - ./router/policy.yaml:/app/router/policy.yaml:ro
      # NOTE: router/sensitivity_patterns.yaml has the same latent production
      # gap as policy.yaml (no Dockerfile COPY; lifespan default path
      # /app/router/sensitivity_patterns.yaml; dev mode masked by
      # docker-compose.override). Out of scope for Story 9-1; will be filed
      # as a sibling finding in epic-9-run-flags.md for a follow-up story.
      # Story 9-5: benchmark corpus + subjective-task anchors. Read-only —
      # the running container loads these during Story 9-6 benchmark runs;
      # corpus + anchor AUTHORING happens host-side via scripts/build_corpus.py.
      # File-level mount for the corpus (single artifact); directory-level for
      # anchors (so the VERSION file stays co-located with the JSONLs the
      # Story 9-7 scorer reads). Same .gitignore + .example-sibling treatment
      # as router/policy.user-overrides.yaml (Story 9-1 precedent).
      - ./evals/email_corpus_v1.jsonl:/app/evals/email_corpus_v1.jsonl:ro
      - ./evals/anchors:/app/evals/anchors:ro
    environment:
      # mailbot-api holds the Anthropic key (Rule F.1)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID:-}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET:-}
      - OUTLOOK_TENANT_ID=${OUTLOOK_TENANT_ID:-}
      - OUTLOOK_REFRESH_TOKEN=${OUTLOOK_REFRESH_TOKEN:-}
      # Story 6-16 (F25 closure): public-client gate — when true, oauth.py +
      # graph_client.py suppress client_secret at token-exchange regardless of
      # OUTLOOK_CLIENT_SECRET. Without this passthrough the AC-2 gate would be
      # dead-on-arrival in production (CR-1).
      - OUTLOOK_PUBLIC_CLIENT=${OUTLOOK_PUBLIC_CLIENT:-}
      - MAILBOT_DB_PATH=/data/mailbot.db
      - OLLAMA_URL=http://ollama:11434
      - MAILBOT_ROUTER_KEY=${MAILBOT_ROUTER_KEY:-}
      # Display timezone — see note on mailbot-hermes service above. All
      # mailbot_api Python code uses tz=timezone.utc explicitly (architecture
      # §AR-PAT-3) so router_calls.ts, emails.*_at, log JSON ts, etc. stay UTC.
      # This only affects human-facing `date` + log-prefix timestamps.
      - TZ=Europe/Paris
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:0.6.2  # pinned to match anthropic/ollama Python SDK pin per AR-BOOT-2
    container_name: mailbot-ollama
    networks:
      - mailbot-net
    volumes:
      - mailbot_ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Story 2-3 AC-10: pre-pull the two models the Router + ingest pipeline need.
  # Idempotent — `ollama pull` is a no-op when the model is already present
  # in the named volume.
  ollama_model_warmup:
    image: ollama/ollama:0.6.2
    container_name: mailbot-ollama-warmup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - mailbot-net
    volumes:
      - mailbot_ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen2.5:3b-instruct-q4_K_M && \
        ollama pull nomic-embed-text && \
        echo "model warmup complete"
    restart: "no"

networks:
  mailbot-net:
    name: mailbot-net
    driver: bridge

volumes:
  mailbot_db:
    name: mailbot_db
  mailbot_ollama:
    name: mailbot_ollama
  mailbot_hermes_data:
    name: mailbot_hermes_data
  mailbot_logs:
    name: mailbot_logs
