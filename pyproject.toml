[project]
name = "mailbot"
version = "0.1.0"
description = "Personal email triage agent with cost-disciplined Router and queued authorized actions"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "_bmad",
    "_bmad-output",
    ".claude",
    "docs/external",
    "_eval-outputs",
    "hermes-docs",
    # Story 10.6.3: `scratch/` holds walk/benchmark scaffolding (CLI-shaped
    # helpers that legitimately print() to stdout/stderr). It is non-product
    # code, never staged (also gitignored), so it is excluded wholesale rather
    # than fixing T201 print-sites that would re-appear with the next helper.
    "scratch",
    # Third-party Hermes-bundled skill directories. MailBot's lint rules
    # don't apply — these are upstream code shipped with the Hermes image.
    # MailBot's own skill (`hermes-config/skills/mailbot/`) IS subject to
    # the gate and is NOT excluded here.
    "hermes-config/skills/apple",
    "hermes-config/skills/autonomous-ai-agents",
    "hermes-config/skills/creative",
    "hermes-config/skills/data-science",
    "hermes-config/skills/devops",
    "hermes-config/skills/diagramming",
    "hermes-config/skills/dogfood",
    "hermes-config/skills/domain",
    "hermes-config/skills/email",
    "hermes-config/skills/gaming",
    "hermes-config/skills/gifs",
    "hermes-config/skills/github",
    "hermes-config/skills/inference-sh",
    "hermes-config/skills/mcp",
    "hermes-config/skills/media",
    "hermes-config/skills/mlops",
    "hermes-config/skills/note-taking",
    "hermes-config/skills/productivity",
    "hermes-config/skills/red-teaming",
    "hermes-config/skills/research",
    "hermes-config/skills/smart-home",
    "hermes-config/skills/social-media",
    "hermes-config/skills/software-development",
    "hermes-config/skills/yuanbao",
]

[tool.ruff.lint]
# Baseline + boundary-enforcement rules per AR-PAT-1.
#   E/F/I/W — pycodestyle / pyflakes / isort / pylint-warning baseline
#   T20     — flake8-print: bans print() outside scripts/ (per AR-PAT-6 Rule F)
#   DTZ     — flake8-datetimez: bans datetime.utcnow() per AR-PAT-3
#   S       — flake8-bandit: catches eval, exec, hardcoded passwords, shell=True
# The selective import-allowlist boundaries (ollama/anthropic in router/models.py
# only, sqlite3 in db/ only, os.environ in config.py only, raw SQL in db/queries.py
# only) are enforced by scripts/check_boundaries.py — ruff doesn't natively support
# per-file import allowlists.
select = ["E", "F", "I", "W", "T20", "DTZ", "S"]
# Allow assert in test code (S101); accept blocking sqlite imports in db modules
# via the standalone boundary checker rather than per-file ruff ignores.
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
# Scripts may print; bandit's hardcoded-IP/binding checks don't apply.
"scripts/**/*.py" = ["T201", "T203"]
# Story 9-6: benchmark/runner.py is CLI-shaped (entry: `python -m benchmark.runner`)
# and legitimately prints run_id / cost-gate breakdown / SIGINT resume hints to
# stdout for Adam's terminal. Same T201/T203 exemption as scripts/.
"benchmark/**/*.py" = ["T201", "T203"]
# Tests may use bandit-flagged patterns (assertions, fixture passwords, etc.).
# E501 line-length is relaxed for test fixture data (verdict-table dicts etc.).
"tests/**/*.py" = ["S", "T20", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_return_any = true
# The cron-script bundle in hermes-config/skills/mailbot/scripts/ uses a
# sibling import (`from _mcp_client import ...`) — Hermes-bundled skills
# are stdlib-only Python invoked as scripts with their dir on sys.path,
# not as packages. Adding the dir to MYPYPATH lets mypy resolve the
# import for static checking from the test file.
mypy_path = ["hermes-config/skills/mailbot/scripts"]
exclude = [
    "\\.venv",
    "build",
    "_bmad",
    "_bmad-output",
    "\\.claude",
    "docs/external",
    "_eval-outputs",
    "hermes-docs",
    # Story 10.6.3: `scratch/` walk/benchmark scaffolding — mirrors the ruff
    # extend-exclude above so a future repo-wide mypy invocation (CI scope
    # widening) never picks up scratch helpers. mypy is invoked scoped to
    # `mailbot_api/` today, so this is durability-symmetry, not a current fix.
    "scratch",
    # Third-party Hermes-bundled skill directories — see ruff exclude
    # block above for the same rationale. MailBot's own skill at
    # `hermes-config/skills/mailbot/` is NOT excluded.
    "hermes-config/skills/apple",
    "hermes-config/skills/autonomous-ai-agents",
    "hermes-config/skills/creative",
    "hermes-config/skills/data-science",
    "hermes-config/skills/devops",
    "hermes-config/skills/diagramming",
    "hermes-config/skills/dogfood",
    "hermes-config/skills/domain",
    "hermes-config/skills/email",
    "hermes-config/skills/gaming",
    "hermes-config/skills/gifs",
    "hermes-config/skills/github",
    "hermes-config/skills/inference-sh",
    "hermes-config/skills/mcp",
    "hermes-config/skills/media",
    "hermes-config/skills/mlops",
    "hermes-config/skills/note-taking",
    "hermes-config/skills/productivity",
    "hermes-config/skills/red-teaming",
    "hermes-config/skills/research",
    "hermes-config/skills/smart-home",
    "hermes-config/skills/social-media",
    "hermes-config/skills/software-development",
    "hermes-config/skills/yuanbao",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Default-exclude `live` so plain `pytest` never burns Anthropic cost. To run
# the live suite explicitly: `pytest -m live` (overrides this exclusion).
#
# `not slow` is co-enforced here defensively: a CI invocation like
# `pytest -m 'not slow'` would OVERRIDE addopts (pytest treats `-m` as
# replacement, not composition) and re-include all `live` tests. By embedding
# both exclusions in addopts, the default behavior stays safe; CI scripts that
# want to override must use the full expression `-m 'not live and not slow'`
# OR `-m live` to opt-in explicitly.
addopts = "-m 'not live and not slow'"
markers = [
    "slow: tests with bulk fixture seeds (>10k rows); opt-out via `-m 'not slow'` in CI if needed",
    "live: tests that hit real external APIs (cost money); opt-in via `-m live`, opted out by default",
]
